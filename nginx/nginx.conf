map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream maskapai_web_cluster {
    least_conn;

    server web1:3000 max_fails=3 fail_timeout=10s;
    server web2:3000 max_fails=3 fail_timeout=10s;
    server web3:3000 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    location = /lb-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://maskapai_web_cluster;
        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
