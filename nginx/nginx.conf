# ===================================================
# Nginx Load Balancer Configuration
# Flight Booking Bazma - Multi-Web Deployment
# ===================================================

# Define the upstream (backend server group)
# Nginx will distribute incoming requests among these servers
upstream flight_booking_app {
    # Round-robin is the default load balancing method
    # Requests are distributed sequentially: web1 -> web2 -> web3 -> web1 -> ...
    server web1:3000;
    server web2:3000;
    server web3:3000;
}

# Main server block - this is what clients connect to
server {
    # Listen on port 80 (standard HTTP port)
    listen 80;
    
    # Server name - accepts all hostnames
    server_name _;

    # Maximum upload file size (for form submissions, etc.)
    client_max_body_size 100M;

    # Proxy settings for better performance
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;

    # Location block - handles ALL incoming requests
    location / {
        # Forward requests to the upstream group
        proxy_pass http://flight_booking_app;

        # Set original host header so the app knows the original URL
        proxy_set_header Host $host;

        # Pass the real client IP address to the application
        proxy_set_header X-Real-IP $remote_addr;

        # Pass the full chain of IP addresses
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Pass the original protocol (http or https)
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (needed for Next.js hot reload and PWA features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}