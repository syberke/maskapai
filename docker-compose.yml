# ============================================
# DOCKER COMPOSE - FLIGHT BOOKING BAZMA
# (Dengan Load Balancer & Network)
# ============================================
# Cara jalanin: docker compose up -d
# Akses app: http://localhost
# ============================================

services:

  # ========== DATABASE (PostgreSQL) ==========
  postgres:
    image: postgres:16-alpine
    container_name: maskapai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maskapai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flight-network

  # ========== WEB APP (3 Instance) ==========
  web1:
    build: .
    container_name: maskapai-web1
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/maskapai?schema=public"
      NODE_ENV: production
      NEXT_PUBLIC_SERVER_ID: "1"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flight-network

  web2:
    build: .
    container_name: maskapai-web2
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/maskapai?schema=public"
      NODE_ENV: production
      NEXT_PUBLIC_SERVER_ID: "2"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flight-network

  web3:
    build: .
    container_name: maskapai-web3
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/maskapai?schema=public"
      NODE_ENV: production
      NEXT_PUBLIC_SERVER_ID: "3"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flight-network

  # ========== LOAD BALANCER (Nginx) ==========
  nginx:
    image: nginx:alpine
    container_name: maskapai-lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web1
      - web2
      - web3
    networks:
      - flight-network

# ========== NETWORK ==========
networks:
  flight-network:
    driver: bridge
    name: maskapai-network

# ========== PENYIMPANAN DATA ==========
volumes:
  postgres_data:
    name: maskapai-postgres-data