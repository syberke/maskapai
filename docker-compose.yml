name: maskapai

x-web-build: &web-build
  context: .
  target: runner
  args:
    NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:?NEXT_PUBLIC_RECAPTCHA_SITE_KEY is required}
    NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:?NEXT_PUBLIC_MIDTRANS_CLIENT_KEY is required}
    NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}

x-web-environment: &web-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-maskapai}?schema=public
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  PORT: "3000"

x-web-common: &web-common
  build: *web-build
  image: maskapai-web:latest
  restart: unless-stopped
  env_file:
    - .env
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 30s
  networks:
    - maskapai_internal

services:
  database:
    image: postgres:16-alpine
    container_name: maskapai-database
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-maskapai}
    volumes:
      - maskapai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    networks:
      - maskapai_internal

  migrate:
    build:
      context: .
      target: migrate
    image: maskapai-migrate:latest
    container_name: maskapai-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-maskapai}?schema=public
    depends_on:
      database:
        condition: service_healthy
    networks:
      - maskapai_internal

  web1:
    <<: *web-common
    container_name: maskapai-web1
    environment:
      <<: *web-environment
      APP_NODE_NAME: web1

  web2:
    <<: *web-common
    container_name: maskapai-web2
    environment:
      <<: *web-environment
      APP_NODE_NAME: web2

  web3:
    <<: *web-common
    container_name: maskapai-web3
    environment:
      <<: *web-environment
      APP_NODE_NAME: web3

  loadbalancer:
    image: nginx:1.27-alpine
    container_name: maskapai-loadbalancer
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
      web3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/lb-health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - maskapai_internal

networks:
  maskapai_internal:
    driver: bridge
    name: maskapai_internal

volumes:
  maskapai_postgres:
    name: maskapai_postgres
