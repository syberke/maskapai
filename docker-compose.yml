name: maskapai

x-web-build: &web-build
  context: .
  target: runner
  args:
    NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:?NEXT_PUBLIC_RECAPTCHA_SITE_KEY is required}
    NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:?NEXT_PUBLIC_MIDTRANS_CLIENT_KEY is required}
    NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}

x-web-environment: &web-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-maskapai}?schema=public
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  PORT: "3000"

x-web-common: &web-common
  build: *web-build
  image: maskapai-web:latest
  restart: unless-stopped
  env_file:
    - .env
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s
  networks:
    - flight-network

services:
  postgres:
    image: postgres:16-alpine
    container_name: maskapai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-maskapai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - flight-network

  migrate:
    build:
      context: .
      target: migrate
    image: maskapai-migrate:latest
    container_name: maskapai-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-maskapai}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flight-network

  web1:
    <<: *web-common
    container_name: maskapai-web1
    environment:
      <<: *web-environment
      NEXT_PUBLIC_SERVER_ID: "1"

  web2:
    <<: *web-common
    container_name: maskapai-web2
    environment:
      <<: *web-environment
      NEXT_PUBLIC_SERVER_ID: "2"

  web3:
    <<: *web-common
    container_name: maskapai-web3
    environment:
      <<: *web-environment
      NEXT_PUBLIC_SERVER_ID: "3"

  nginx:
    image: nginx:alpine
    container_name: maskapai-lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
      web3:
        condition: service_healthy
    networks:
      - flight-network

networks:
  flight-network:
    driver: bridge
    name: maskapai-network

volumes:
  postgres_data:
    name: maskapai-postgres-data
